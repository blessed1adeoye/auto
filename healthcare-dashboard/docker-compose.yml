# docker-compose.yml
version: '3.8'

services:
  dashboard:
    build: .
    container_name: healthcare-dashboard
    ports:
      - "8050:8050"
    environment:
      - PORT=8050
    restart: unless-stopped
    volumes:
      - ./data:/app/data  # Mount your data folder
      - ./data/automation.xlsx:/app/data/automation.xlsx  # Mount specific file